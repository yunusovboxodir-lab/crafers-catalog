function loadImage(file) {
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Не удалось прочитать файл как изображение')); };
    img.src = url;
  });
}
function scaled(img, max) {
  const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas');
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height); return c;
}
const toBlob = c => new Promise(r => c.toBlob(r, 'image/jpeg', 0.86));

// Зум: картинка вписана в экран, масштаб через transform вокруг точки под курсором, сдвиг перетаскиванием, щипок двумя пальцами
const Z = { s: 1, x: 0, y: 0, ptrs: new Map(), pinch: null, drag: null };
function applyZ(anim) {
  const im = document.getElementById('bb-lbimg'), st = document.getElementById('bb-stage'); if (!im || !st) return;
  const r = st.getBoundingClientRect(), w = im.offsetWidth * Z.s, h = im.offsetHeight * Z.s;
  const mx = Math.max(0, (w - r.width) / 2), my = Math.max(0, (h - r.height) / 2);
  Z.x = Math.min(mx, Math.max(-mx, Z.x)); Z.y = Math.min(my, Math.max(-my, Z.y));
  im.style.transition = anim ? 'transform .18s ease-out' : 'none';
  im.style.transform = `translate(${Z.x}px, ${Z.y}px) scale(${Z.s})`;
  im.style.cursor = Z.s > 1 ? 'grab' : 'zoom-in';
}
function zoomBy(f, cx, cy, anim = true) {
  const st = document.getElementById('bb-stage'); if (!st) return;
  const r = st.getBoundingClientRect();
  const px = (cx ?? r.width / 2) - r.width / 2, py = (cy ?? r.height / 2) - r.height / 2;
  const s = Math.min(5, Math.max(1, Z.s * f)), k = s / Z.s;
  Z.x = px - (px - Z.x) * k; Z.y = py - (py - Z.y) * k; Z.s = s;
  if (s === 1) { Z.x = 0; Z.y = 0; }
  applyZ(anim);
}
document.addEventListener('pointerdown', ev => {
  if (ev.target.id !== 'bb-lbimg') return;
  ev.preventDefault(); ev.target.setPointerCapture?.(ev.pointerId);
  Z.ptrs.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  if (Z.ptrs.size === 2) { const [a, b] = [...Z.ptrs.values()]; Z.pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), s: Z.s }; Z.drag = null; }
  else Z.drag = { x: ev.clientX, y: ev.clientY, ox: Z.x, oy: Z.y };
});
document.addEventListener('pointermove', ev => {
  if (!Z.ptrs.has(ev.pointerId)) return;
  Z.ptrs.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  const st = document.getElementById('bb-stage'); if (!st) return; const r = st.getBoundingClientRect();
  if (Z.pinch && Z.ptrs.size === 2) {
    const [a, b] = [...Z.ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y);
    zoomBy((Z.pinch.s * d / Z.pinch.d) / Z.s, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top, false);
  } else if (Z.drag && Z.s > 1) {
    Z.x = Z.drag.ox + ev.clientX - Z.drag.x; Z.y = Z.drag.oy + ev.clientY - Z.drag.y; applyZ(false);
  }
});
const endPtr = ev => { Z.ptrs.delete(ev.pointerId); if (Z.ptrs.size < 2) Z.pinch = null; if (!Z.ptrs.size) Z.drag = null; };
document.addEventListener('pointerup', endPtr); document.addEventListener('pointercancel', endPtr);
window.addEventListener('resize', () => applyZ(false));

const today = () => new Date().toLocaleDateString('ru-RU');
function mergedState() {
  const st = JSON.parse(JSON.stringify(SAVED));
  for (const [sku, v] of Object.entries(pending.statuses)) { if (v.s === 'active' && !v.note) delete st.statuses[sku]; else st.statuses[sku] = v; }
  for (const sku of new Set([...Object.keys(pending.photosAdd), ...Object.keys(pending.photosDel)])) {
    const keep = (st.photos[sku] || []).filter((_, i) => !(pending.photosDel[sku] || []).includes(i));
    const all = [...keep, ...(pending.photosAdd[sku] || [])];
    if (all.length) st.photos[sku] = all; else delete st.photos[sku];
  }
  st.updated = new Date().toLocaleString('ru-RU');
  return st;
}
const jsonBlock = o => JSON.stringify(o).replace(/</g, '\\u003c');
function buildDocument(state) {
  const reset = document.head.querySelector('style')?.textContent || '';
  const body = document.querySelector('title').outerHTML
    + '<meta name="claude:viewport-fit-sides" content="cover">'
    + '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&display=swap">'

  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>' + body + '</body></html>';
}

async function save() {
  if (!artifactNs) return;
  const btn = document.getElementById('bb-do-save'); if (btn) { btn.disabled = true; btn.textContent = 'Сохраняю…'; }
  try { sessionStorage.setItem('bb-pending', JSON.stringify(pending)); } catch (e) {}
  try {
    await artifactNs.publish(buildDocument(mergedState()));
    try { sessionStorage.removeItem('bb-pending'); } catch (e) {}
  } catch (e) {
    const code = e && e.code;
    if (code === 'conflict') { toast('Кто-то сохранил раньше. Страница обновится, ваши правки останутся несохранёнными.'); return; }
    try { sessionStorage.removeItem('bb-pending'); } catch (e2) {}
    if (code === 'not_writer' || code === 'not_granted' || code === 'consent_required' || code === 'capability_disabled') { canWrite = false; render(); toast('У вас доступ только на просмотр. Правки не сохранены.'); return; }
    if (code === 'too_large') { toast('Страница стала слишком большой. Уберите часть загруженных фото и сохраните снова.'); }
    else if (code === 'rate_limited') { toast('Слишком часто. Подождите минуту и сохраните снова.'); }
    else { toast('Не удалось сохранить. Попробуйте ещё раз через минуту.'); }
    if (btn) { btn.disabled = false; btn.textContent = 'Сохранить для всех'; }
  }
}

    render(); if (sheetOpen && openSku) openSheet(openSku); if (cartOpen) { if (cart.length) openCart(); else document.getElementById('bb-cartdlg').close(); } return;
  }

  if (t.id === 'bb-cart-close') { document.getElementById('bb-cartdlg').close(); return; }
  if (t.id === 'bb-sheet-save' && openSku) {
    const sku = openSku, p = D.products.find(x => x.sku === sku);
    const s = document.querySelector('input[name="bb-st"]:checked')?.value || 'active', note = document.getElementById('bb-note').value.trim();

      if (!r.ok) { toast(r.error === 'bad_pin' ? 'PIN-код не подошёл. Проверьте лист «Доступ» в таблице.' : 'Не удалось сохранить.'); if (r.error === 'bad_pin') { pinSaved = ''; try { localStorage.removeItem('bb-pin'); } catch (e) {} } t.disabled = false; t.textContent = 'Сохранить статус'; return; }
      pinSaved = pin; try { localStorage.setItem('bb-pin', pin); } catch (e) {}
      SHEET[sku] = { s, note, at: today(), who: r.name }; render(); openSheet(sku); toast('Статус сохранён. Его видят все, кто откроет сайт.');
    } catch (e) { toast('Нет связи с таблицей. Попробуйте ещё раз.'); t.disabled = false; t.textContent = 'Сохранить статус'; }
    return;
  }
  if (t.id === 'bb-send') {
    const who = document.getElementById('bb-who').value.trim();
    if (!who) { toast('Напишите, кто просит: имя и компания.'); document.getElementById('bb-who').focus(); return; }
    const items = cart.map(s => D.products.find(p => p.sku === s)).filter(Boolean).map(p => ({ sku: p.sku, name: p.name }));
    t.disabled = true; t.textContent = 'Отправляю…';
    try { const r = await sheetPost({ action: 'request', who, items }); if (!r.ok) throw 0;
      cart = []; saveCart(); document.getElementById('bb-cartdlg').close(); render(); toast('Заявка отправлена. Фото пришлют в Telegram.'); }
    catch (e) { toast('Не удалось отправить. Скопируйте текст и пришлите его в Telegram.'); t.disabled = false; t.textContent = 'Отправить заявку'; }
    return;
  }
  if (t.id === 'bb-cart-clear') { cart = []; saveCart(); document.getElementById('bb-cartdlg').close(); render(); return; }
  if (t.id === 'bb-copy') {
    const ta = document.getElementById('bb-req'); let ok = false;
    try { await navigator.clipboard.writeText(ta.value); ok = true; } catch (e) { ta.focus(); ta.select(); try { ok = document.execCommand('copy'); } catch (e2) {} }
    toast(ok ? 'Заявка скопирована. Вставьте её в Telegram.' : 'Скопировать не вышло. Текст выделен: нажмите Ctrl+C или «Копировать».'); return;
  }
  if (t.classList.contains('zoom')) { openLightbox(t.dataset.big, t.dataset.thumb); return; }
  if (t.id === 'bb-zin') { zoomBy(1.6); return; }
  if (t.id === 'bb-zout') { zoomBy(1 / 1.6); return; }
  if (t.id === 'bb-zfit') { zoomBy(1 / Z.s); return; }
  if (t.id === 'bb-lb-close') { document.getElementById('bb-lb').close(); return; }
  if (t.id === 'bb-apply' && openSku) {
    const s = document.querySelector('input[name="bb-st"]:checked')?.value || 'active';
    const note = document.getElementById('bb-note').value.trim();
    const cur = SAVED.statuses[openSku] || { s: 'active' };
    if (s === cur.s && note === (cur.note || '')) delete pending.statuses[openSku]; else pending.statuses[openSku] = { s, note, at: today() };
    render(); openSheet(openSku); toast('Статус применён. Нажмите «Сохранить для всех» внизу.'); return;
  }
  if (t.dataset.del !== undefined && openSku) {
    const i = +t.dataset.del, savedN = (SAVED.photos[openSku] || []).length - (pending.photosDel[openSku] || []).length;
    if (i < savedN) { const kept = (SAVED.photos[openSku] || []).map((_, k) => k).filter(k => !(pending.photosDel[openSku] || []).includes(k)); (pending.photosDel[openSku] = pending.photosDel[openSku] || []).push(kept[i]); }
    else { pending.photosAdd[openSku].splice(i - savedN, 1); if (!pending.photosAdd[openSku].length) delete pending.photosAdd[openSku]; }
    render(); openSheet(openSku); return;
  }
  if (t.id === 'bb-do-save') { save(); return; }
  if (t.id === 'bb-do-reset') { pending = { statuses: {}, photosAdd: {}, photosDel: {} }; render(); return; }
});
document.addEventListener('change', async ev => {
  if (ev.target.id === 'bb-jump' && ev.target.value) { document.getElementById(ev.target.value)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); ev.target.value = ''; }
  if (ev.target.id === 'bb-file' && openSku) {
    const sku = openSku;
    toast('Загружаю фото…');
    for (const f of ev.target.files) {
      try {
        const img = await loadImage(f); const t = scaled(img, 240).toDataURL('image/jpeg', 0.75); let id = null;
        if (assetsNs) { const r = await assetsNs.upload(await toBlob(scaled(img, 1600)), { type: 'image/jpeg' }); id = r.id; }
        (pending.photosAdd[sku] = pending.photosAdd[sku] || []).push(id ? { id, t, at: today() } : { t: scaled(img, 480).toDataURL('image/jpeg', 0.8), at: today() });
      } catch (e) { toast(e && e.code === 'too_large' ? 'Файл больше 20 МБ, выберите поменьше.' : (e && e.message) || 'Не удалось загрузить фото.'); }
    }
    render(); openSheet(sku); toast('Фото добавлено. Нажмите «Сохранить для всех» внизу.');
  }
  if (ev.target.id === 'bb-who') { try { localStorage.setItem('bb-who', ev.target.value.trim()); } catch (e) {} const ta = document.getElementById('bb-req'); if (ta) ta.value = requestText(ev.target.value.trim()); }
});
document.addEventListener('wheel', ev => { if (ev.target.closest && ev.target.closest('#bb-stage')) { ev.preventDefault(); const r = document.getElementById('bb-stage').getBoundingClientRect(); zoomBy(Math.exp(-ev.deltaY * 0.0015), ev.clientX - r.left, ev.clientY - r.top, false); } }, { passive: false });
document.addEventListener('dblclick', ev => { if (ev.target.id === 'bb-lbimg') { const r = document.getElementById('bb-stage').getBoundingClientRect(); zoomBy(Z.s > 1 ? 1 / Z.s : 2.5, ev.clientX - r.left, ev.clientY - r.top); } });
let qTimer; document.addEventListener('input', ev => { if (ev.target.id === 'bb-q') { clearTimeout(qTimer); qTimer = setTimeout(() => { query = ev.target.value.trim().toLowerCase(); render(); }, 200); } });

render();
if (D.sheet) fetch(D.sheet).then(r => r.json()).then(r => { if (r && r.ok) { SHEET = r.statuses || {}; sheetState = 'ok'; render(); if (openSku) openSheet(openSku); } }).catch(() => { sheetState = 'err'; });
(async () => {
  if (!window.claude || !window.claude.use) return;
  try {
    const [user, art, as] = await Promise.all([claude.use('user'), claude.use('artifact'), claude.use('assets')]);
    artifactNs = art; assetsNs = as;
    canWrite = !!(art && user && await user.canEdit());
    if (canWrite || pendingCount()) render();
  } catch (e) {}
})();
})();
</script>
